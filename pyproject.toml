# --- Project metadata ---

[project]
name = "diamonds"
version = "0.1.0"
description = "Preprocess & Train a model to predict diamond price"
authors = [
    {name = "Your Name",email = "you@example.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "scikit-learn (>=1.8.0,<2.0.0)",
    "pandas (>=2.0.1,<3.0.0)",
    "loguru (>=0.7.3,<0.8.0)",
    "seaborn (>=0.13.2,<0.14.0)",
    "mlflow (>=3.10.1,<4.0.0)"
]

# --- Poetry ---

[tool.poetry]

[tool.poetry.group.dev.dependencies]
notebook = "^7.5.4"
ruff = ">=0.9.0"
pre-commit = ">=4.0.0"
pytest = ">=8.0.0"

# --- Ruff: replaces flake8 (lint) + black (format) ---

[tool.ruff]
line-length = 88  # black-compatible default
exclude = ["notebooks/"]

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: isort, N: naming conventions
select = ["E", "F", "I", "N"]
# N802/N803/N806: uppercase X/y is standard sklearn convention for feature matrix / target vector
ignore = ["N802", "N803", "N806"]

# --- Pytest ---

[tool.pytest.ini_options]
testpaths = ["src/tests"]

# --- Build ---

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
